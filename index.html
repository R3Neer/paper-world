<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Paper · A world of time</title><link rel="stylesheet" href="device-canvas.css"><link rel="stylesheet" href="styles.css?v=integrated-3"></head><body>
<main id="app" class="world-app">
 <div id="scene" aria-hidden="true"></div>
 <header class="masthead">
  <button id="edit" class="ink-button">CHANGE</button>
  <div class="edit-toolbar" aria-hidden="true">
   <button id="edit-back" class="ink-button">BACK</button>
   <p><span>CHANGE MODE</span><strong>SELECT A BLOCK TO REPLACE</strong></p>
  </div>
 </header>
 <nav id="mode-nav" aria-label="Time tools"><button id="mode-up" class="mode-key" aria-label="Previous time tool"><span>CHRONO</span><b>↑</b></button><button id="mode-down" class="mode-key" aria-label="Next time tool"><span>TIMERS</span><b>↓</b></button></nav>
 <div id="home"><div id="clock-targets" aria-label="Time blocks"></div></div>
 <section id="selector" hidden aria-label="Choose a city"><div class="selector-heading"><button id="close-selector" class="ink-button" aria-label="Back to the nine blocks">←</button><div><span>A NEW DESTINATION FOR</span><h1 id="replace-name"></h1></div></div><div id="catalog" tabindex="0" role="region" aria-label="Explore clocks. Drag in any direction or use the arrow keys."><div id="city-grid"></div><p id="empty" hidden>No matching cities.<br>Try another search.</p></div><form id="search-form" role="search"><label for="search">FIND YOUR NEXT TIME ZONE</label><div><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="Search a city or country" aria-label="Search a city or country"><button type="button" id="clear-search" aria-label="Clear search">×</button></div></form></section>
 <div id="instrument-targets"></div>
 <form id="duration-editor" hidden><label for="duration-input">TIMER</label><input id="duration-input" value="00:00" inputmode="numeric" aria-label="Timer minutes and seconds"><button type="submit" class="ink-button">SET</button></form>
 <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main><script src="device-canvas.js?v=integrated-3"></script><script src="script.js?v=integrated-3"></script></body></html>
